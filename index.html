<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة نادي شوتوكان VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- رأس الصفحة -->
        <header class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-6 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-red-500 flex items-center gap-3">
                    <i class="fa-solid fa-dumbbell"></i> نادي شوتوكان VIP
                </h1>
                <p class="text-slate-400 text-sm mt-1">نظام إدارة الاشتراكات السحابي (Firebase)</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="downloadBackup()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium transition shadow-md flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-download"></i> نسخ احتياطي
                </button>
                <button onclick="openAddModal()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-xl font-medium transition shadow-md flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-user-plus"></i> إضافة لاعب جديد
                </button>
            </div>
        </header>

        <!-- فلتر واختيار الشهر وإدارة الشهر -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6 shadow-md flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <label for="filterMonth" class="text-slate-300 font-medium"><i class="fa-regular fa-calendar-days text-red-500"></i> عرض شهر:</label>
                <select id="filterMonth" onchange="renderApp()" class="bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-red-500">
                    <option value="10">شهر 10 (تشرين الأول)</option>
                    <option value="11">شهر 11 (تشرين الثاني)</option>
                    <option value="12">شهر 12 (كانون الأول)</option>
                    <option value="1">شهر 1 (كانون الثاني)</option>
                    <option value="2">شهر 2 (شباط)</option>
                    <option value="3">شهر 3 (آذار)</option>
                </select>
                <button onclick="deleteEntireMonth()" class="bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-700/50 px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1">
                    <i class="fa-solid fa-trash"></i> حذف كل لاعبي هذا الشهر
                </button>
            </div>
            <div id="monthStats" class="flex flex-wrap gap-3 text-sm font-semibold">
                <!-- الإحصائيات -->
            </div>
        </div>

        <!-- جدول اللاعبين للشهر المحدد -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-lg overflow-hidden">
            <div class="p-5 border-b border-slate-700 flex justify-between items-center">
                <h2 id="tableTitle" class="text-lg font-bold text-white">قائمة اللاعبين</h2>
                <span class="text-xs bg-slate-900 text-emerald-400 px-3 py-1 rounded-full border border-slate-700 flex items-center gap-1">
                    <i class="fa-solid fa-wifi text-xs"></i> متصل بالسحابة
                </span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-900/50 text-slate-400 text-sm border-b border-slate-700">
                            <th class="p-4">اسم اللاعب</th>
                            <th class="p-4">رقم الهاتف</th>
                            <th class="p-4">نوع الاشتراك</th>
                            <th class="p-4">المبلغ المدفوع</th>
                            <th class="p-4">المبلغ المتبقي (دفعات)</th>
                            <th class="p-4">حالة الاشتراك</th>
                            <th class="p-4 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="playersTableBody" class="divide-y divide-slate-700/50 text-sm">
                        <tr><td colspan="7" class="text-center p-6 text-slate-400">جاري تحميل البيانات من السحابة...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة لاعب -->
    <div id="playerModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-pen text-red-500"></i> إضافة لاعب جديد
            </h3>
            <form id="playerForm" onsubmit="savePlayer(event)" class="space-y-4">
                <div>
                    <label class="block text-slate-400 text-sm mb-1">اسم اللاعب</label>
                    <input type="text" id="playerName" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-slate-400 text-sm mb-1">رقم الهاتف</label>
                    <input type="text" id="playerPhone" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-red-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-400 text-sm mb-1">الشهر المستهدف</label>
                        <select id="playerMonth" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-red-500">
                            <option value="10">شهر 10</option>
                            <option value="11">شهر 11</option>
                            <option value="12">شهر 12</option>
                            <option value="1">شهر 1</option>
                            <option value="2">شهر 2</option>
                            <option value="3">شهر 3</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-sm mb-1">نوع الاشتراك</label>
                        <input type="text" id="playerType" placeholder="عادي / كيك بوكسينغ" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-red-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-400 text-sm mb-1">المبلغ المدفوع</label>
                        <input type="number" id="playerPaid" value="0" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-sm mb-1">المبلغ المتبقي (عليك)</label>
                        <input type="number" id="playerDebt" value="0" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-red-500">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 text-sm mb-1">حالة الاشتراك</label>
                    <select id="playerStatus" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-red-500">
                        <option value="ساري">ساري (فعال)</option>
                        <option value="منتهي">منتهي</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeAddModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl transition">إلغاء</button>
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-xl transition">حفظ في السحابة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ربط مكتبات Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://sotokan-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const playersRef = ref(db, 'players');

        let playersData = {};

        // جلب البيانات من Firebase وتحديث العرض
        onValue(playersRef, (snapshot) => {
            playersData = snapshot.val() || {};
            renderApp();
        });

        window.openAddModal = function() {
            document.getElementById('playerModal').classList.remove('hidden');
            document.getElementById('playerModal').classList.add('flex');
        };

        window.closeAddModal = function() {
            document.getElementById('playerModal').classList.remove('flex');
            document.getElementById('playerModal').classList.add('hidden');
        };

        window.savePlayer = function(e) {
            e.preventDefault();
            const newPlayer = {
                name: document.getElementById('playerName').value,
                phone: document.getElementById('playerPhone').value,
                month: document.getElementById('playerMonth').value,
                type: document.getElementById('playerType').value,
                paid: parseFloat(document.getElementById('playerPaid').value) || 0,
                debt: parseFloat(document.getElementById('playerDebt').value) || 0,
                status: document.getElementById('playerStatus').value
            };

            push(playersRef, newPlayer);
            closeAddModal();
            document.getElementById('playerForm').reset();
        };

        window.deletePlayer = function(id) {
            if(confirm('هل أنت متأكد من حذف هذا اللاعب؟')) {
                remove(ref(db, `players/${id}`));
            }
        };

        // ميزة تنزيل النسخة الاحتياطية
        window.downloadBackup = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(playersData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `نسخة_احتياطية_نادي_شوتوكان_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };

        // ميزة حذف كل لاعبي الشهر المحدد
        window.deleteEntireMonth = function() {
            const selectedMonth = document.getElementById('filterMonth').value;
            let count = 0;
            for (let id in playersData) {
                let pMonth = playersData[id].month || "10";
                if (pMonth === selectedMonth) count++;
            }

            if (count === 0) {
                alert(`لا يوجد لاعبين في شهر ${selectedMonth} لحذفهم.`);
                return;
            }

            if (confirm(`⚠️ تحذير: هل أنت متأكد من حذف جميع لاعبي شهر ${selectedMonth} وعددهم (${count}) لاعبين؟ لا يمكن التراجع عن هذه الخطوة!`)) {
                for (let id in playersData) {
                    let pMonth = playersData[id].month || "10";
                    if (pMonth === selectedMonth) {
                        remove(ref(db, `players/${id}`));
                    }
                }
            }
        };

        window.renderApp = function() {
            const selectedMonth = document.getElementById('filterMonth').value;
            const tableBody = document.getElementById('playersTableBody');
            document.getElementById('tableTitle').innerText = `قائمة لاعبي شهر ${selectedMonth}`;

            let totalRevenue = 0;
            let expiredCount = 0;
            let debtCount = 0;
            let count = 0;

            tableBody.innerHTML = '';

            for (let id in playersData) {
                let p = playersData[id];
                // إذا لم يكن للاعب القديم شهر محدد، يوضع تلقائياً في شهر 10
                let playerMonth = p.month || "10";

                if (playerMonth === selectedMonth) {
                    count++;
                    totalRevenue += (p.paid || 0);
                    if (p.status === 'منتهي') expiredCount++;
                    if ((p.debt || 0) > 0) debtCount++;

                    tableBody.innerHTML += `
                        <tr class="hover:bg-slate-900/30 transition">
                            <td class="p-4 font-medium text-white">${p.name}</td>
                            <td class="p-4 text-slate-400">${p.phone || '-'}</td>
                            <td class="p-4 text-slate-300"><span class="bg-slate-700/50 px-2.5 py-1 rounded-lg text-xs">${p.type || 'عادي'}</span></td>
                            <td class="p-4 text-emerald-400 font-semibold">$${p.paid || 0}</td>
                            <td class="p-4 text-amber-400 font-semibold">${(p.debt || 0) > 0 ? '$' + p.debt : 'لا يوجد'}</td>
                            <td class="p-4">
                                <span class="px-3 py-1 rounded-full text-xs font-medium ${p.status === 'ساري' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}">
                                    ${p.status || 'ساري'}
                                </span>
                            </td>
                            <td class="p-4 text-center">
                                <button onclick="deletePlayer('${id}')" class="text-slate-500 hover:text-red-400 transition p-2" title="حذف">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }
            }

            if (count === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-slate-500">لا يوجد لاعبين مسجلين في شهر ${selectedMonth} حتى الآن.</td></tr>`;
            }

            document.getElementById('monthStats').innerHTML = `
                <div class="bg-slate-900 px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                    <span class="text-slate-400 text-xs">إجمالي مدخول الشهر:</span>
                    <span class="text-emerald-400 font-bold">$${totalRevenue}</span>
                </div>
                <div class="bg-slate-900 px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                    <span class="text-slate-400 text-xs">اشتراكات منتهية:</span>
                    <span class="text-red-400 font-bold">${expiredCount}</span>
                </div>
                <div class="bg-slate-900 px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                    <span class="text-slate-400 text-xs">عليهم دفعات:</span>
                    <span class="text-amber-400 font-bold">${debtCount}</span>
                </div>
            `;
        };
    </script>
</body>
</html>
